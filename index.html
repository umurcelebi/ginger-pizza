<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ginger Pizza — Çok Yakında</title>
  <meta name="description" content="Ginger Pizza çok yakında sizlerle. Fırınımız ısınıyor, hazırlanıyoruz.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fdf8f2;
      --surface: #fffdf9;
      --ink: #231814;
      --muted: #6f5a50;
      --accent: #d95d24;
      --accent-soft: #f6e3d4;
      --ginger: #e59a3a;
      --border: rgba(35, 24, 20, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 18%, rgba(229, 154, 58, 0.16), transparent 42%),
        radial-gradient(circle at 85% 82%, rgba(217, 93, 36, 0.14), transparent 44%),
        var(--bg);
      color: var(--ink);
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 600px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: clamp(32px, 6vw, 56px);
      text-align: center;
      box-shadow: 0 24px 60px rgba(35, 24, 20, 0.08);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.35);
        opacity: 0.55;
      }
    }

    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(2.5rem, 7vw, 3.8rem);
      line-height: 1.06;
      letter-spacing: -0.02em;
      margin-bottom: 18px;
      color: var(--ink);
    }

    h1 span {
      color: var(--accent);
    }

    p {
      font-size: clamp(1rem, 2.4vw, 1.125rem);
      line-height: 1.65;
      color: var(--muted);
      max-width: 44ch;
      margin: 0 auto;
    }

    .divider {
      width: 56px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--ginger), var(--accent));
      margin: 28px auto;
    }

    .status {
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--ink);
      opacity: 0.78;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">
      <span class="dot" aria-hidden="true"></span>
      Hazırlanıyoruz
    </div>
    <h1>Ginger <span>Pizza</span></h1>
    <p>
      Hamurumuz dinleniyor, fırınımız ısınıyor. Çok yakında yepyeni sitemiz ve lezzetlerimizle buradayız.
    </p>
    <div class="divider" aria-hidden="true"></div>
    <p class="status">Çok yakında yayında</p>
  </main>
</body>
</html>
